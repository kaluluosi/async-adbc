name: Publish PyPI
run-name: ${{github.actor}} is publishing ${{ inputs.version || github.ref_name || github.event.release.tag_name }} to PyPI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"  # 匹配 1.0.0, 1.0.0a1, 1.0.0rc1 等
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.0.0, 2.0.0a1)'
        required: true
        type: string

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          pip install build twine

      - name: Determine version
        id: determine-version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          # 去掉可能存在的 v 前缀，兼容两种情况
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version in pyproject.toml
        run: |
          VERSION="${{ steps.determine-version.outputs.VERSION }}"
          sed -i "s/^version = \".*\"$/version = \"$VERSION\"/" pyproject.toml
          cat pyproject.toml  # 验证修改

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  docs:
    name: Deploy Docs
    needs: [deploy]
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
    with:
      deploy: true
