name: Publish PyPI
run-name: ${{github.actor}} is publishing ${{ inputs.version || github.ref_name || github.event.release.tag_name }} to PyPI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"  # 匹配 1.0.0, 1.0.0a1, 1.0.0rc1 等
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.0.0, 2.0.0a1)'
        required: true
        type: string

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Determine version
        id: determine-version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          # 去掉可能存在的 v 前缀，兼容两种情况
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version with uv
        run: |
          VERSION="${{ steps.determine-version.outputs.VERSION }}"
          uv version "$VERSION"
          cat pyproject.toml  # 验证修改

      - name: Build package with uv
        run: uv build

      - name: Publish to PyPI with uv
        run: uv publish --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}

  docs:
    name: Deploy Docs
    needs: [deploy]
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
    with:
      deploy: true
